---
- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  listen: Activate kAI Docker configuration

- name: Record the successfully loaded Docker configuration
  ansible.builtin.copy:
    dest: /etc/kai/docker-applied.sha1
    content: "{{ kai_docker_configuration.checksum }}\n"
    owner: root
    group: root
    mode: '0600'
  listen: Activate kAI Docker configuration
