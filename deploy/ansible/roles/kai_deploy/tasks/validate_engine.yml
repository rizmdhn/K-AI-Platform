---
- name: Require supported local Engine and Compose versions before deployment
  ansible.builtin.assert:
    that:
      - (kai_deploy_engine_version.stdout | trim) is version('28.0.0', '>=')
      - (kai_deploy_compose_version.stdout | trim | regex_replace('^v', '')) is version('2.24.4', '>=')
    fail_msg: Deployment requires Docker Engine 28.0.0+ and Compose 2.24.4+ for loopback isolation and override tags.
