---
- name: Reload validated SSH configuration
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  listen: Activate kAI SSH configuration

- name: Record the successfully loaded SSH configuration
  ansible.builtin.copy:
    dest: /etc/kai/ssh-applied.sha1
    content: "{{ kai_ssh_configuration.checksum }}\n"
    owner: root
    group: root
    mode: '0600'
  listen: Activate kAI SSH configuration
