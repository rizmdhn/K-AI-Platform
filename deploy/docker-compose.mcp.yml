# Activated by make when KAI_MCP_ENABLED=true in root .env. Local build; promote an immutable image before production.
services:
  api:
    environment:
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN:-}
      KAI_PLATFORM_INTERNAL_TOKEN: ${KAI_PLATFORM_INTERNAL_TOKEN:-}
    networks:
      - default
      - tools_private
      - model_private
    depends_on:
      clickhouse-mcp:
        condition: service_healthy

  clickhouse-mcp:
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ../services/clickhouse-mcp
    image: kai-clickhouse-mcp:0.7.0
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8443}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kai_unbound}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN:-}
      KAI_PLATFORM_INTERNAL_TOKEN: ${KAI_PLATFORM_INTERNAL_TOKEN:-}
      KAI_METRICS_TOKEN: ${KAI_METRICS_TOKEN:-}
      CLICKHOUSE_SECURE: "true"
      CLICKHOUSE_VERIFY: "true"
      # Optional private CA (path inside the container; mount the file via a compose override). Empty = public CAs.
      CLICKHOUSE_CA_CERT: ${CLICKHOUSE_CA_CERT:-}
      CLICKHOUSE_ALLOW_WRITE_ACCESS: "false"
      CLICKHOUSE_ALLOW_DROP: "false"
      CHDB_ENABLED: "false"
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CLICKHOUSE_MCP_ALLOWED_HOSTS: clickhouse-mcp:8000,127.0.0.1:8000,localhost:8000
      MCP_MIDDLEWARE_MODULE: per_user_middleware
      KAI_BINDING_MODE: managed
      KAI_CH_MAX_EXECUTION_TIME: ${KAI_CH_MAX_EXECUTION_TIME:-}
      KAI_CH_MAX_MEMORY_USAGE: ${KAI_CH_MAX_MEMORY_USAGE:-}
      KAI_CH_MAX_ROWS_TO_READ: ${KAI_CH_MAX_ROWS_TO_READ:-}
      KAI_CH_MAX_BYTES_TO_READ: ${KAI_CH_MAX_BYTES_TO_READ:-}
      KAI_ENROLLMENT_DSN: ${KAI_ENROLLMENT_DSN:-}
      KAI_BINDING_ACTIVE_KEY_VERSION: ${KAI_BINDING_ACTIVE_KEY_VERSION:-1}
      KAI_LIBRECHAT_INTERNAL_URL: ${KAI_LIBRECHAT_INTERNAL_URL:-http://api:3080}
      KAI_BINDING_DSN: ${KAI_BINDING_DSN:-}
      KAI_BINDING_KEY_DIR: ${KAI_BINDING_KEY_DIR:-/run/kai-binding-keys}
      KAI_LIBRECHAT_ISSUER: ${KAI_LIBRECHAT_ISSUER:-librechat-local}
      # FR-11: table search also shows descriptions/tags curated in the client's OpenMetadata. Set in the Admin
      # Panel (stored via KAI_CATALOG_DSN, token encrypted with the binding keyring); these .env values are the fallback.
      KAI_CATALOG_DSN: ${KAI_CATALOG_DSN:-}
      KAI_OPENMETADATA_URL: ${KAI_OPENMETADATA_URL:-}
      KAI_OPENMETADATA_TOKEN: ${KAI_OPENMETADATA_TOKEN:-}
      KAI_OPENMETADATA_SERVICE: ${KAI_OPENMETADATA_SERVICE:-}
      KAI_OPENMETADATA_CA_CERT: ${KAI_OPENMETADATA_CA_CERT:-}
      
      # a key saved only in the Admin Panel is not visible here. Empty key = the tool says it is not configured.
      KAI_BATCH_MODEL_BASE_URL: ${KAI_BATCH_MODEL_BASE_URL:-https://ollama.com/v1}
      KAI_BATCH_MODEL: ${KAI_BATCH_MODEL:-gpt-oss:120b}
      KAI_BATCH_MODEL_API_KEY: ${KAI_BATCH_MODEL_API_KEY:-${OLLAMA_API_KEY:-}}
      KAI_BATCH_ENABLED: ${KAI_BATCH_ENABLED:-false}
      KAI_BATCH_SAMPLE_ROWS: ${KAI_BATCH_SAMPLE_ROWS:-2000}
      KAI_BATCH_JOBS_PER_DAY: ${KAI_BATCH_JOBS_PER_DAY:-10}
      # Local bge-m3 for search_database_metadata; unreachable (documents profile off) = keyword ranking.
      KAI_EMBEDDINGS_URL: "${KAI_EMBEDDINGS_BASE_URL:-http://embeddings:8080/v1}/embeddings"
      # P6-11: audit lines also go to /var/log/kai/audit.jsonl, rotated daily, kept N days.
      KAI_AUDIT_LOG_DIR: /var/log/kai
      KAI_LOG_RETENTION_DAYS: ${KAI_LOG_RETENTION_DAYS:-90}
    volumes:
      - audit-logs:/var/log/kai
    networks:
      - tools_private
      - tool_egress
      - embed_private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  # FR-08 catalog worker: idle unless KAI_CATALOG_ENABLED=true. Drafts descriptions for empty tables/columns and
  # sends them to OpenMetadata as suggestions for the DBA. Same image as the MCP, worker code mounted read-only.
  # Reaches OpenMetadata and the model provider only; never ClickHouse, no user credentials, no tools_private.
  # Gemini on Vertex AI with an express API key (vertex_proxy.py): LibreChat's "Vertex AI" endpoint sends here,
  # the key goes to Google as x-goog-api-key. Separate from the MCP so chat survives MCP restarts and the MCP
  # has no model-provider route. Empty key/project = answers 503.
  vertex-proxy:
    image: kai-clickhouse-mcp:0.7.0
    pull_policy: never  # built by the clickhouse-mcp service, never pulled
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    entrypoint: ["python", "-m", "uvicorn", "vertex_proxy:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      PYTHONPATH: /app
      KAI_PLATFORM_INTERNAL_TOKEN: ${KAI_PLATFORM_INTERNAL_TOKEN:-}
      KAI_VERTEX_API_KEY: ${KAI_VERTEX_API_KEY:-}
      KAI_VERTEX_PROJECT_ID: ${KAI_VERTEX_PROJECT_ID:-}
      KAI_VERTEX_LOCATION: ${KAI_VERTEX_LOCATION:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - model_private  # only api; never tools_private, so it cannot reach the MCP
      - model_egress   # own internet route: tool_egress would also reach the MCP
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  metadata-worker:
    image: kai-clickhouse-mcp:0.7.0
    pull_policy: never  # built by the clickhouse-mcp service, never pulled
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    entrypoint: ["python", "/worker/catalog.py"]
    environment:
      PYTHONPATH: /worker:/app
      # Admin Panel settings: read from Postgres, token decrypted with the binding keyring (mounted read-only).
      KAI_BINDING_KEY_DIR: /run/kai-binding-keys
      KAI_BINDING_ACTIVE_KEY_VERSION: ${KAI_BINDING_ACTIVE_KEY_VERSION:-1}
      KAI_CATALOG_ENABLED: ${KAI_CATALOG_ENABLED:-false}
      KAI_CATALOG_DSN: ${KAI_CATALOG_DSN:-}
      KAI_CATALOG_DATABASES: ${KAI_CATALOG_DATABASES:-}
      KAI_CATALOG_SCAN_HOURS: ${KAI_CATALOG_SCAN_HOURS:-24}
      KAI_CATALOG_MAX_TABLES_PER_SCAN: ${KAI_CATALOG_MAX_TABLES_PER_SCAN:-50}
      KAI_OPENMETADATA_URL: ${KAI_OPENMETADATA_URL:-}
      KAI_OPENMETADATA_TOKEN: ${KAI_OPENMETADATA_TOKEN:-}
      KAI_OPENMETADATA_SERVICE: ${KAI_OPENMETADATA_SERVICE:-}
      KAI_OPENMETADATA_CA_CERT: ${KAI_OPENMETADATA_CA_CERT:-}
      KAI_BATCH_MODEL_BASE_URL: ${KAI_BATCH_MODEL_BASE_URL:-https://ollama.com/v1}
      KAI_BATCH_MODEL: ${KAI_BATCH_MODEL:-gpt-oss:120b}
      KAI_BATCH_MODEL_API_KEY: ${KAI_BATCH_MODEL_API_KEY:-${OLLAMA_API_KEY:-}}
    volumes:
      - ../services/metadata-worker:/worker:ro
    networks:
      - tool_egress
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  # Only the local embedding server joins MCP here; it never gets tools_private.
  embeddings:
    networks:
      - embed_private

networks:
  tools_private:
    internal: true
  model_private:
    internal: true
  model_egress:
  embed_private:
    internal: true
  tool_egress:

volumes:
  audit-logs:
